<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QQ Music Mini</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header"><span class="brand-mark">♫</span><h1>QQ Music Mini</h1></header>
      <p id="notice" class="notice" role="status" hidden></p>
      <section id="login-view" class="login-view" hidden>
        <p>登录后查看你的音乐和歌单。</p>
        <button id="login-button" class="primary">登录 QQ 音乐</button>
        <div id="qr-panel" class="qr-panel" hidden>
          <img id="qr-image" alt="QQ 音乐登录二维码">
          <p id="qr-status">请使用 QQ 扫码登录</p>
          <button id="retry-login" class="text-button">重新获取二维码</button>
        </div>
      </section>
      <section id="music-view" class="music-view" hidden>
        <nav class="nav" aria-label="主导航">
          <button class="nav-button active" data-tab="liked">我喜欢</button>
          <button class="nav-button" data-tab="playlists">歌单</button>
          <button class="nav-button" data-tab="search">搜索</button>
        </nav>
        <div id="content" class="content"></div>
      </section>
    </main>
    <footer id="mini-player" class="mini-player">
      <div id="player-cover" class="player-cover" aria-hidden="true">♪</div>
      <div class="now-playing"><strong id="player-title">暂无播放歌曲</strong><span id="player-artist"></span></div>
      <div class="player-controls" aria-label="播放器控制">
        <button data-control="previous" aria-label="上一首"></button>
        <button id="toggle-button" data-control="toggle" aria-label="播放"></button>
        <button data-control="next" aria-label="下一首"></button>
      </div>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
